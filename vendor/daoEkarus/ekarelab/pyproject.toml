[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ekarelab"
version = "0.1.0"
description = "Offline DataElab readers and analysis tools for Ekarus telemetry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arte",
    "astropy",
    "numpy",
]

[tool.setuptools.packages.find]
where = ["src"]