# Prima Drop 2 — lab BMC Multi-DM 5.5 µm (USB Multi Driver)
# Requires BMC Linux Python SDK (`import bmc`) on the USB host.
# Placeholder serial until lab install — replace XXXXXXX with mirror SN.
#
# Start (on the USB host):
#   plico_dm_server conf/dm-bmc-lab.conf dmBmc
#
# Runner accepts model=bmc and model=bmcMultiDM (alias).

[deviceBmc]
name= BMC Multi-DM 5.5um Prima
model= bmcMultiDM
serial_number= XXXXXXX
# No default_flat_tag until a 140-act MultiDM-01 flat is saved in calib.

[dmBmc]
name= Prima BMC Multi-DM (lab)
log_level= info
mirror= deviceBmc
host= localhost
port= 7050

[processMonitor]
name= Monitor Prima BMC DM processes
host= localhost
port= 7060
server_config_prefix= dm
spawn_delay= 1

[global]
app_name= inaf.arcetri.ao.plico_dm_server
app_author= INAF Arcetri Adaptive Optics
python_package_name= plico_dm_server
