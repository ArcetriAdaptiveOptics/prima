# Prima Drop 3 — Allied Vision Alvium G1-2040m (GigE) via pysilico avt path
# pysilico_server AvtCamera already special-cases Alvium stream BPS / bit depth.
#
# Role: Drop 3 focal-plane / optical-gain camera (not Drop 1 WFS — that stays Manta G-419).
# Status: not powered yet → not on network. Placeholder IP only; update after discovery.
#
# Start (when powered):
#   pysilico_server conf/camera-alvium-g1.conf camera1

[deviceAlviumG1]
name= Allied Vision Alvium G1-2040m
model= avt
ip_address= 192.168.30.191
# Optional: camera_name= Alvium G1-2040m

[camera1]
name= Prima Alvium G1-2040m Camera
log_level= info
camera= deviceAlviumG1
host= localhost
port= 7100

[processMonitor]
name= Monitor Prima Alvium G1-2040m camera
host= localhost
port= 7110
server_config_prefix= camera
spawn_delay= 1

[global]
app_name= inaf.arcetri.ao.pysilico_server
app_author= INAF Arcetri Adaptive Optics
python_package_name= pysilico_server
