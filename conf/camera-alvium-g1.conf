# Prima Drop 1/3 — Allied Vision Alvium G1 (GigE) via pysilico avt path
# pysilico_server AvtCamera already special-cases Alvium stream BPS / bit depth.
# Use as Drop 1 WFS swap for Manta G-419, or Drop 3 focal-plane / gain camera.
#
# Fill IP / name after lab discovery (Vimba / Allied GigE Vision).
# Start:
#   pysilico_server conf/camera-alvium-g1.conf camera1

[deviceAlviumG1]
name= Allied Vision Alvium G1
model= avt
ip_address= 192.168.30.191
# Optional: camera_name= Alvium…

[camera1]
name= Prima Alvium G1 Camera
log_level= info
camera= deviceAlviumG1
host= localhost
port= 7100

[processMonitor]
name= Monitor Prima Alvium camera
host= localhost
port= 7110
server_config_prefix= camera
spawn_delay= 1

[global]
app_name= inaf.arcetri.ao.pysilico_server
app_author= INAF Arcetri Adaptive Optics
python_package_name= pysilico_server
