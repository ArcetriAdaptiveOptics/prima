# Prima phase-1 — laptop sim (no hardware)
# Camera: simulated pyramid WFS via pysilico
# Modulator: simulatedModulator via plico_dm_server
#
# Start (from editable installs / venv):
#   pysilico_server  <this-or-installed> camera1
#   plico_dm_server  conf/modulator-sim.conf modulator1
# Or use the scripts under scripts/

[devicePyramidWfsCameraSimulated]
name= Simulated Pyramid WFS Camera
model= simulatedPyramidWfsCamera
binning= 4

[camera1]
name= Prima PWFS Camera (sim)
log_level= info
camera= devicePyramidWfsCameraSimulated
host= localhost
port= 7130

[processMonitor]
name= Monitor Prima pysilico processes
host= localhost
port= 7140
server_config_prefix= camera
spawn_delay= 1

[global]
app_name= inaf.arcetri.ao.pysilico_server
app_author= INAF Arcetri Adaptive Optics
python_package_name= pysilico_server
