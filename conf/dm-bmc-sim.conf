# Prima Drop 2 — laptop sim BMC Multi-DM 5.5 µm (140 actuators)
# Uses model=simulatedMEMS140 via plico_dm_server (no USB SDK required).
#
# Start:
#   plico_dm_server conf/dm-bmc-sim.conf dmBmc
#
# REPL:
#   import plico_dm, numpy as np
#   dm = plico_dm.deformableMirror('localhost', 7050)
#   print(dm.getNumberOfActuators())  # 140
#   dm.setShape(np.zeros(140)); dm.setShape(np.eye(140)[3] * 0.1)

[deviceSimulatedBmcMultiDM]
name= Simulated BMC Multi-DM 140
model= simulatedMEMS140
serial_number= BMC-SIM-140
n_actuators= 140
# Intentionally no default_flat_tag — shared "zero" flat is 36-act.

[dmBmc]
name= Prima BMC Multi-DM (sim)
log_level= info
mirror= deviceSimulatedBmcMultiDM
host= localhost
port= 7050

[processMonitor]
name= Monitor Prima BMC DM processes
host= localhost
port= 7060
server_config_prefix= dm
spawn_delay= 1

[global]
app_name= inaf.arcetri.ao.plico_dm_server
app_author= INAF Arcetri Adaptive Optics
python_package_name= plico_dm_server
