# Prima phase-1 — laptop sim PWFS modulator (plico_dm_server)
# Uses model=simulatedModulator — no E-518 / S-334 required.
#
# Start:
#   plico_dm_server conf/modulator-sim.conf modulator1
#
# REPL:
#   import plico_dm
#   m = plico_dm.modulator('localhost', 7030)
#   m.setRadiusInMilliRad(1.5); m.setFrequencyInHz(20.0)

[deviceSimulatedModulator]
name= Simulated PWFS Modulator
model= simulatedModulator

[modulator1]
name= Prima PWFS Modulator (sim)
log_level= info
modulator= deviceSimulatedModulator
host= localhost
port= 7030

[processMonitor]
name= Monitor Prima modulator processes
host= localhost
port= 7040
server_config_prefix= modulator
spawn_delay= 1

[global]
app_name= inaf.arcetri.ao.plico_dm_server
app_author= INAF Arcetri Adaptive Optics
python_package_name= plico_dm_server
