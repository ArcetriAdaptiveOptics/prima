# Prima phase-1 — lab PI S-334 @ E-518.I3 (PWFS modulator)
# model=piS334Modulator wraps TipTilt2Axis + PIS334Modulator (NOT piTipTilt DM).
# Confirm ip_address / serial_number on this bench; calib tag lives in
# plico_dm_server calib/modulator/pi_calibration.py (SN 110032051 shipped).

[devicePiS334Modulator]
name= PI S334 PWFS Modulator (E-518.I3)
model= piS334Modulator
serial_number= 110032051
ip_address= 193.206.155.117

[modulator1]
name= Prima PWFS Modulator (lab E-518)
log_level= info
modulator= devicePiS334Modulator
host= localhost
port= 7030

[processMonitor]
name= Monitor Prima modulator processes
host= localhost
port= 7040
server_config_prefix= modulator
spawn_delay= 1

[global]
app_name= inaf.arcetri.ao.plico_dm_server
app_author= INAF Arcetri Adaptive Optics
python_package_name= plico_dm_server
