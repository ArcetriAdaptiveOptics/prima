# Prima phase-1 — lab Manta G-419 (Allied Vision / Vimba, pysilico model=avt)
# Set ip_address to the camera GigE address on this bench before starting.

[deviceMantaG419]
name= AVT Manta G-419
model= avt
ip_address= 192.168.30.189
streambytespersecond= 50000000
binning= 4
pixel_format= Mono8

[camera1]
name= Prima PWFS Camera (Manta G-419)
log_level= info
camera= deviceMantaG419
host= localhost
port= 7130

[processMonitor]
name= Monitor Prima pysilico processes
host= localhost
port= 7140
server_config_prefix= camera
spawn_delay= 1

[global]
app_name= inaf.arcetri.ao.pysilico_server
app_author= INAF Arcetri Adaptive Optics
python_package_name= pysilico_server
