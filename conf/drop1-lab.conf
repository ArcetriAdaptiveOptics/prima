# Prima Drop 1 — lab work-mode defaults (Manta + PI E-518)
# Canonical code source: prima/drop1_defaults.py (GUI + engine import that).
# Env overrides: PRIMA_MOD_RADIUS_MRAD, PRIMA_MOD_FREQ_HZ, PRIMA_EXPOSURE_MS,
#                PRIMA_CAMERA_WIDTH, PRIMA_CAMERA_HEIGHT, PRIMA_ARAVIS_IP,
#                PRIMA_E518_HOST, PRIMA_E518_PORT
#
# Launch:
#   prima-gui --live --aravis-ip 192.168.30.189 --e518-host 192.168.30.190

[modulator]
radius_mrad = 4.0
frequency_hz = 20.0
center_x_mrad = 0.0
center_y_mrad = 0.0

[camera]
pixel_format = Mono12
width = 2048
height = 2048
offset_x = 0
offset_y = 0
exposure_ms = 40.0
lock_exp_to_freq = false
ip = 192.168.30.189

[display]
roi_x0 = 0
roi_y0 = 0
roi_width = 2048
roi_height = 2048

[e518]
host = 192.168.30.190
port = 50000
